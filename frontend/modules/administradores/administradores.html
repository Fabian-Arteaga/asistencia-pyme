<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AsistenciaPyme | Administradores</title>

    <link rel="stylesheet" href="../../shared/css/layout.css" />

    <link rel="stylesheet" href="./administradores.css" />
  </head>

  <body>
    <div id="sidebarContainer"></div>

    <div id="topbarContainer"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="contenido-principal">
      <div class="pagina-contenido">
        <section class="encabezado-pagina">
          <div>
            <h2>Gestión de administradores</h2>

            <p>Administre las cuentas con acceso al sistema.</p>
          </div>

          <div class="encabezado-pagina__acciones">
            <button
              type="button"
              id="btnCambiarContrasena"
              class="boton boton--secundario"
            >
              Cambiar mi contraseña
            </button>

            <button
              type="button"
              id="btnNuevoAdministrador"
              class="boton boton--primario"
            >
              Nuevo administrador
            </button>
          </div>
        </section>

        <section class="panel-administradores">
          <div class="herramientas">
            <div class="campo-herramienta">
              <label for="buscarAdministrador"> Buscar </label>

              <input
                type="search"
                id="buscarAdministrador"
                placeholder="Buscar por nombre o correo"
                autocomplete="off"
              />
            </div>

            <div class="campo-herramienta campo-herramienta--estado">
              <label for="filtroEstado"> Estado </label>

              <select id="filtroEstado">
                <option value="todos">Todos</option>

                <option value="activo">Activos</option>

                <option value="inactivo">Inactivos</option>
              </select>
            </div>

            <div class="herramientas__acciones">
              <span id="contadorAdministradores"> 0 administradores </span>

              <button
                type="button"
                id="btnActualizar"
                class="boton boton--secundario"
              >
                Actualizar
              </button>
            </div>
          </div>

          <div
            id="mensajeAdministradores"
            class="mensaje mensaje--oculto"
            role="alert"
            aria-live="polite"
          ></div>

          <div id="estadoCarga" class="estado-tabla">
            Cargando administradores...
          </div>

          <div
            id="contenedorTabla"
            class="tabla-contenedor tabla-contenedor--oculto"
          >
            <table class="tabla-administradores">
              <thead>
                <tr>
                  <th>Administrador</th>
                  <th>Correo electrónico</th>
                  <th>Estado</th>

                  <th class="columna-acciones">Acciones</th>
                </tr>
              </thead>

              <tbody id="tablaAdministradoresBody"></tbody>
            </table>
          </div>

          <div id="sinResultados" class="estado-tabla estado-tabla--oculto">
            No se encontraron administradores.
          </div>
        </section>
      </div>
    </main>

    <!-- Modal para crear y editar administrador -->
    <div id="modalAdministrador" class="modal modal--oculto" aria-hidden="true">
      <div id="fondoModalAdministrador" class="modal__fondo"></div>

      <section
        class="modal__contenido"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalAdministrador"
      >
        <div class="modal__encabezado">
          <h3 id="tituloModalAdministrador">Nuevo administrador</h3>

          <button
            type="button"
            id="btnCerrarModalAdministrador"
            class="modal__cerrar"
            aria-label="Cerrar"
          >
            ×
          </button>
        </div>

        <form id="formAdministrador" autocomplete="off" novalidate>
          <input type="hidden" id="idAdministrador" />

          <div class="formulario-grid">
            <div class="campo-formulario">
              <label for="nombresAdministrador"> Nombres </label>

              <input
                type="text"
                id="nombresAdministrador"
                maxlength="100"
                placeholder="Ingrese los nombres"
                required
              />
            </div>

            <div class="campo-formulario">
              <label for="apellidosAdministrador"> Apellidos </label>

              <input
                type="text"
                id="apellidosAdministrador"
                maxlength="100"
                placeholder="Ingrese los apellidos"
                required
              />
            </div>

            <div class="campo-formulario campo-formulario--completo">
              <label for="correoAdministrador"> Correo electrónico </label>

              <input
                type="email"
                id="correoAdministrador"
                maxlength="150"
                placeholder="administrador@correo.com"
                autocomplete="off"
                required
              />
            </div>

            <div id="grupoContrasena" class="campo-formulario">
              <label for="contrasenaAdministrador"> Contraseña </label>

              <input
                type="password"
                id="contrasenaAdministrador"
                minlength="8"
                maxlength="100"
                autocomplete="new-password"
                placeholder="Mínimo 8 caracteres"
              />
            </div>

            <div id="grupoConfirmarContrasena" class="campo-formulario">
              <label for="confirmarContrasenaAdministrador">
                Confirmar contraseña
              </label>

              <input
                type="password"
                id="confirmarContrasenaAdministrador"
                minlength="8"
                maxlength="100"
                autocomplete="new-password"
                placeholder="Repita la contraseña"
              />
            </div>
          </div>

          <div
            id="mensajeFormulario"
            class="mensaje mensaje--oculto mensaje--modal"
            role="alert"
          ></div>

          <div class="modal__acciones">
            <button
              type="button"
              id="btnCancelarAdministrador"
              class="boton boton--secundario"
            >
              Cancelar
            </button>

            <button
              type="submit"
              id="btnGuardarAdministrador"
              class="boton boton--primario"
            >
              Guardar
            </button>
          </div>
        </form>
      </section>
    </div>

    <!-- Modal para cambiar la contraseña propia -->
    <div id="modalContrasena" class="modal modal--oculto" aria-hidden="true">
      <div id="fondoModalContrasena" class="modal__fondo"></div>

      <section
        class="modal__contenido modal__contenido--pequeno"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalContrasena"
      >
        <div class="modal__encabezado">
          <h3 id="tituloModalContrasena">Cambiar mi contraseña</h3>

          <button
            type="button"
            id="btnCerrarModalContrasena"
            class="modal__cerrar"
            aria-label="Cerrar"
          >
            ×
          </button>
        </div>

        <form id="formContrasena" autocomplete="off" novalidate>
          <div class="campo-formulario">
            <label for="contrasenaActual"> Contraseña actual </label>

            <input
              type="password"
              id="contrasenaActual"
              maxlength="100"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="campo-formulario">
            <label for="nuevaContrasena"> Nueva contraseña </label>

            <input
              type="password"
              id="nuevaContrasena"
              minlength="8"
              maxlength="100"
              autocomplete="new-password"
              placeholder="Mínimo 8 caracteres"
              required
            />
          </div>

          <div class="campo-formulario">
            <label for="confirmarNuevaContrasena">
              Confirmar nueva contraseña
            </label>

            <input
              type="password"
              id="confirmarNuevaContrasena"
              minlength="8"
              maxlength="100"
              autocomplete="new-password"
              required
            />
          </div>

          <div
            id="mensajeContrasena"
            class="mensaje mensaje--oculto mensaje--modal"
            role="alert"
          ></div>

          <div class="modal__acciones">
            <button
              type="button"
              id="btnCancelarContrasena"
              class="boton boton--secundario"
            >
              Cancelar
            </button>

            <button
              type="submit"
              id="btnGuardarContrasena"
              class="boton boton--primario"
            >
              Cambiar contraseña
            </button>
          </div>
        </form>
      </section>
    </div>

    <script type="module" src="./administradores.js"></script>
  </body>
</html>
