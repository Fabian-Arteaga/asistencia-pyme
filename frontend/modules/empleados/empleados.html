<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AsistenciaPyme | Empleados</title>

    <link rel="stylesheet" href="../../shared/css/layout.css" />

    <link rel="stylesheet" href="./empleados.css" />
  </head>

  <body>
    <div id="sidebarContainer"></div>

    <div id="topbarContainer"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="contenido-principal">
      <div class="pagina-contenido">
        <section class="encabezado-pagina">
          <div>
            <h2>Gestión de empleados</h2>

            <p>Registre y administre los empleados de la empresa.</p>
          </div>

          <button
            type="button"
            id="btnNuevoEmpleado"
            class="boton boton--primario"
          >
            Nuevo empleado
          </button>
        </section>

        <section class="panel-empleados">
          <div class="herramientas">
            <div class="campo-herramienta">
              <label for="buscarEmpleado"> Buscar </label>

              <input
                type="search"
                id="buscarEmpleado"
                placeholder="Código, nombre o identificación"
                autocomplete="off"
              />
            </div>

            <div class="campo-herramienta campo-herramienta--estado">
              <label for="filtroEstado"> Estado </label>

              <select id="filtroEstado">
                <option value="todos">Todos</option>

                <option value="activo">Activos</option>

                <option value="inactivo">Inactivos</option>
              </select>
            </div>

            <div class="herramientas__acciones">
              <span id="contadorEmpleados"> 0 empleados </span>

              <button
                type="button"
                id="btnActualizar"
                class="boton boton--secundario"
              >
                Actualizar
              </button>
            </div>
          </div>

          <div
            id="mensajeEmpleados"
            class="mensaje mensaje--oculto"
            role="alert"
            aria-live="polite"
          ></div>

          <div id="estadoCarga" class="estado-tabla">Cargando empleados...</div>

          <div
            id="contenedorTabla"
            class="tabla-contenedor tabla-contenedor--oculto"
          >
            <table class="tabla-empleados">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Empleado</th>
                  <th>Identificación</th>
                  <th>Cargo</th>
                  <th>Contratación</th>
                  <th>Salario base</th>
                  <th>Estado</th>
                  <th class="columna-acciones">Acciones</th>
                </tr>
              </thead>

              <tbody id="tablaEmpleadosBody"></tbody>
            </table>
          </div>

          <div id="sinResultados" class="estado-tabla estado-tabla--oculto">
            No se encontraron empleados.
          </div>
        </section>
      </div>
    </main>

    <!-- Modal crear y editar -->
    <div id="modalEmpleado" class="modal modal--oculto" aria-hidden="true">
      <div id="fondoModalEmpleado" class="modal__fondo"></div>

      <section
        class="modal__contenido modal__contenido--grande"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalEmpleado"
      >
        <div class="modal__encabezado">
          <h3 id="tituloModalEmpleado">Nuevo empleado</h3>

          <button
            type="button"
            id="btnCerrarModalEmpleado"
            class="modal__cerrar"
            aria-label="Cerrar"
          >
            ×
          </button>
        </div>

        <form id="formEmpleado" autocomplete="off" novalidate>
          <input type="hidden" id="idEmpleado" />

          <div class="formulario-grid">
            <div class="campo-formulario">
              <label for="codigoEmpleado"> Código de empleado </label>

              <input
                type="text"
                id="codigoEmpleado"
                maxlength="20"
                placeholder="Ejemplo: EMP001"
                autocomplete="off"
                required
              />
            </div>

            <div class="campo-formulario">
              <label for="idCargo"> Cargo </label>

              <select id="idCargo" required>
                <option value="">Seleccione un cargo</option>
              </select>
            </div>

            <div class="campo-formulario">
              <label for="nombres"> Nombres </label>

              <input type="text" id="nombres" maxlength="100" required />
            </div>

            <div class="campo-formulario">
              <label for="apellidos"> Apellidos </label>

              <input type="text" id="apellidos" maxlength="100" required />
            </div>

            <div class="campo-formulario">
              <label for="identificacion"> Identificación </label>

              <input
                type="text"
                id="identificacion"
                maxlength="30"
                placeholder="Número de identificación"
                required
              />
            </div>

            <div class="campo-formulario">
              <label for="telefono"> Teléfono </label>

              <input
                type="tel"
                id="telefono"
                maxlength="20"
                placeholder="Opcional"
              />
            </div>

            <div class="campo-formulario">
              <label for="correo"> Correo electrónico </label>

              <input
                type="email"
                id="correo"
                maxlength="150"
                placeholder="Opcional"
              />
            </div>

            <div class="campo-formulario">
              <label for="fechaContratacion"> Fecha de contratación </label>

              <input type="date" id="fechaContratacion" required />
            </div>

            <div class="campo-formulario campo-formulario--completo">
              <label for="direccion"> Dirección </label>

              <input
                type="text"
                id="direccion"
                maxlength="250"
                placeholder="Dirección o lugar de trabajo"
              />
            </div>

            <div class="campo-formulario">
              <label for="salarioBase"> Salario base </label>

              <input
                type="number"
                id="salarioBase"
                min="0.01"
                step="0.01"
                placeholder="0.00"
                required
              />
            </div>

            <div id="grupoPin" class="campo-formulario">
              <label for="pin"> PIN de marcaje </label>

              <input
                type="password"
                id="pin"
                minlength="4"
                maxlength="6"
                inputmode="numeric"
                pattern="[0-9]{4,6}"
                autocomplete="new-password"
                placeholder="Entre 4 y 6 números"
              />
            </div>
          </div>

          <div
            id="mensajeFormulario"
            class="mensaje mensaje--oculto"
            role="alert"
          ></div>

          <div class="modal__acciones">
            <button
              type="button"
              id="btnCancelarEmpleado"
              class="boton boton--secundario"
            >
              Cancelar
            </button>

            <button
              type="submit"
              id="btnGuardarEmpleado"
              class="boton boton--primario"
            >
              Guardar
            </button>
          </div>
        </form>
      </section>
    </div>

    <!-- Modal cambiar PIN -->
    <div id="modalPin" class="modal modal--oculto" aria-hidden="true">
      <div id="fondoModalPin" class="modal__fondo"></div>

      <section
        class="modal__contenido modal__contenido--pequeno"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalPin"
      >
        <div class="modal__encabezado">
          <h3 id="tituloModalPin">Cambiar PIN</h3>

          <button
            type="button"
            id="btnCerrarModalPin"
            class="modal__cerrar"
            aria-label="Cerrar"
          >
            ×
          </button>
        </div>

        <form id="formPin" autocomplete="off" novalidate>
          <input type="hidden" id="idEmpleadoPin" />

          <p class="texto-modal">
            Nuevo PIN para
            <strong id="nombreEmpleadoPin"> el empleado </strong>.
          </p>

          <div class="campo-formulario">
            <label for="nuevoPin"> Nuevo PIN </label>

            <input
              type="password"
              id="nuevoPin"
              minlength="4"
              maxlength="6"
              inputmode="numeric"
              pattern="[0-9]{4,6}"
              autocomplete="new-password"
              placeholder="Entre 4 y 6 números"
              required
            />
          </div>

          <div
            id="mensajePin"
            class="mensaje mensaje--oculto"
            role="alert"
          ></div>

          <div class="modal__acciones">
            <button
              type="button"
              id="btnCancelarPin"
              class="boton boton--secundario"
            >
              Cancelar
            </button>

            <button
              type="submit"
              id="btnGuardarPin"
              class="boton boton--primario"
            >
              Cambiar PIN
            </button>
          </div>
        </form>
      </section>
    </div>

    <script type="module" src="./empleados.js"></script>
  </body>
</html>
