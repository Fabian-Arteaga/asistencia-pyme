<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsistenciaPyme | Departamentos</title>
    <link rel="stylesheet" href="../../shared/css/layout.css" />
    <link rel="stylesheet" href="./departamentos.css" />
  </head>
  <body>
    <div id="sidebarContainer"></div>
    <div id="topbarContainer"></div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="contenido-principal">
      <div class="pagina-contenido">
        <section class="encabezado-pagina">
          <div>
            <h2>Gestión de departamentos</h2>
            <p>Administre los departamentos del negocio.</p>
          </div>
          <button type="button" id="btnNuevoDepartamento" class="boton boton--primario">Nuevo departamento</button>
        </section>

        <section class="panel-empleados">
          <div class="herramientas">
            <div class="campo-herramienta">
              <label for="buscarDepartamento">Buscar</label>
              <input type="search" id="buscarDepartamento" placeholder="Nombre o descripción" autocomplete="off" />
            </div>
            <div class="herramientas__acciones">
              <span id="contadorDepartamentos">0 departamentos</span>
              <button type="button" id="btnActualizar" class="boton boton--secundario">Actualizar</button>
            </div>
          </div>

          <div id="mensajeDepartamentos" class="mensaje mensaje--oculto" role="alert" aria-live="polite"></div>
          <div id="estadoCarga" class="estado-tabla">Cargando departamentos...</div>

          <div id="contenedorTabla" class="tabla-contenedor tabla-contenedor--oculto">
            <table class="tabla-empleados">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th>Estado</th>
                  <th class="columna-acciones">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaDepartamentosBody"></tbody>
            </table>
          </div>

          <div id="sinResultados" class="estado-tabla estado-tabla--oculto">No se encontraron departamentos.</div>
        </section>
      </div>
    </main>

    <div id="modalDepartamento" class="modal modal--oculto" aria-hidden="true">
      <div id="modalFondo" class="modal__fondo"></div>
      <section class="modal__contenido modal__contenido--pequeno" role="dialog" aria-modal="true" aria-labelledby="tituloModalDepartamento">
        <div class="modal__encabezado">
          <h3 id="tituloModalDepartamento">Nuevo departamento</h3>
          <button type="button" id="btnCerrarModal" class="modal__cerrar" aria-label="Cerrar">×</button>
        </div>

        <form id="formDepartamento" autocomplete="off" novalidate>
          <input type="hidden" id="idDepartamento" />

          <div class="formulario-grid">
            <div class="campo-formulario campo-formulario--completo">
              <label for="nombreDepartamento">Nombre</label>
              <input type="text" id="nombreDepartamento" maxlength="100" required />
            </div>

            <div class="campo-formulario campo-formulario--completo">
              <label for="descripcionDepartamento">Descripción</label>
              <textarea id="descripcionDepartamento" maxlength="250" rows="4" placeholder="Opcional"></textarea>
            </div>
          </div>

          <div id="mensajeFormulario" class="mensaje mensaje--oculto" role="alert"></div>

          <div class="modal__acciones">
            <button type="button" id="btnCancelar" class="boton boton--secundario">Cancelar</button>
            <button type="submit" id="btnGuardarDepartamento" class="boton boton--primario">Guardar</button>
          </div>
        </form>
      </section>
    </div>

    <script type="module" src="./departamentos.js"></script>
  </body>
</html>
